description: Azure Kubernetes Service charges only for the cluster-management control plane (Free,
  Standard, Premium tiers); worker-node VMs and other Azure resources are billed separately at standard
  Azure rates. AKS Long-Term Support (LTS), Azure Container Storage, and uptime SLA differ by tier.
sources:
  - https://azure.microsoft.com/en-us/pricing/details/kubernetes-service/
  - https://learn.microsoft.com/en-us/azure/aks/free-standard-pricing-tiers
plans:
  - id: microsoft-azure-kubernetes-service-free
    name: Free
    type: freemium
    description: No-cost cluster management for dev/test and small non-critical workloads. No SLA;
      best-effort availability.
    entries:
      - label: Cluster management / hour
        name: free_cluster
        type: subscription
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Worker node VMs
        name: worker_nodes
        type: metered
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: 'standard Azure VM rates'
        userMultiplied: false
    elements:
      - name: No SLA (best-effort)
      - name: Recommended for dev/test
      - name: Worker nodes pay standard VM rates
  - id: microsoft-azure-kubernetes-service-standard
    name: Standard
    type: subscription
    description: Production-grade cluster management with 99.95% (with AZ) / 99.9% uptime SLA on
      the API server.
    entries:
      - label: Cluster management / hour
        name: standard_cluster
        type: subscription
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: '0.10'
        userMultiplied: false
      - label: Worker node VMs
        name: standard_workers
        type: metered
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: 'standard Azure VM rates'
        userMultiplied: false
    elements:
      - name: 99.95% (with AZ) / 99.9% API server SLA
      - name: Recommended for production
      - name: Worker nodes pay standard VM rates
  - id: microsoft-azure-kubernetes-service-premium
    name: Premium
    type: subscription
    description: Standard plus Long-Term Support (LTS) - up to 2 years of Kubernetes version support
      per release. Recommended for regulated and long-lived workloads.
    entries:
      - label: Cluster management / hour
        name: premium_cluster
        type: subscription
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: '0.60'
        userMultiplied: false
      - label: Worker node VMs
        name: premium_workers
        type: metered
        metric: hour
        limit: -1
        timeFrame: hour
        geo: per-region
        unit: 1
        price: 'standard Azure VM rates'
        userMultiplied: false
    elements:
      - name: All Standard features
      - name: Long-Term Support (up to 2 years per K8s release)
      - name: Recommended for regulated workloads
