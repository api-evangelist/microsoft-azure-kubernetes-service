principles:
  - name: Visibility
    description: Use AKS Cost Analysis (built-in cost view powered by OpenCost) to break down spend
      by namespace, deployment, and label; export Azure Cost Management to a Log Analytics workspace
      for deeper analysis.
  - name: Allocation
    description: Use Kubernetes namespaces and labels (team, cost-center, environment) propagated
      to AKS Cost Analysis tags; place per-team workloads in isolated node pools where chargeback
      requires hard separation.
  - name: Optimization
    description: Right-size requests/limits with VPA recommendations; use Cluster Autoscaler / Karpenter;
      mix Reserved Instances and Spot node pools; consolidate dev/test on Free tier; pick Standard
      over Premium when LTS is not required.
  - name: Accountability
    description: Assign cluster owners; alert on cost-per-namespace anomalies; review node-pool
      sizing monthly; periodically delete idle clusters and orphaned PVCs.
