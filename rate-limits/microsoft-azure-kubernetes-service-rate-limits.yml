specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Azure Kubernetes Service
providerId: microsoft-azure-kubernetes-service
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - Kubernetes
  - Microsoft Azure
description: AKS exposes two distinct API surfaces - the Azure Resource Manager (ARM) plane for cluster
  management (provisioning, scaling, upgrades) and the Kubernetes API server inside each cluster. ARM
  has its own per-subscription rate limits; the Kubernetes API server's limits depend on tier (Free
  vs Standard/Premium SLA) and cluster size. Premium adds priority and fairness controls.
sources:
  - https://learn.microsoft.com/en-us/azure/aks/quotas-skus-regions
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/request-limits-and-throttling
  - https://learn.microsoft.com/en-us/azure/aks/uptime-sla
headers:
  retryAfter: Retry-After
  rateLimitRemaining: x-ms-ratelimit-remaining-subscription-reads
responseCodes:
  throttled: 429
limits:
  - name: ARM read requests per subscription per hour
    scope: subscription
    metric: requests_per_hour
    limit: 12000
    timeFrame: hour
    notes: Apply to AKS provisioning and management API calls.
  - name: ARM write requests per subscription per hour
    scope: subscription
    metric: requests_per_hour
    limit: 1200
    timeFrame: hour
  - name: Free tier API server availability
    scope: cluster
    metric: availability
    limit: 'best-effort, no SLA'
  - name: Standard tier API server availability
    scope: cluster
    metric: availability
    limit: '99.95% (with AZ) / 99.9% (without AZ)'
  - name: Premium tier API server availability
    scope: cluster
    metric: availability
    limit: '99.95% (with AZ) / 99.9% (without AZ)'
  - name: Per-cluster API server QPS
    scope: cluster
    metric: queries_per_second
    limit: 'see cluster API server flow control / max-mutating-requests-inflight; 200/400 default'
  - name: Pods per cluster
    scope: cluster
    metric: pods
    limit: 5000
  - name: Nodes per cluster
    scope: cluster
    metric: nodes
    limit: 5000
policies:
  - name: ARM throttling
    description: Honor x-ms-ratelimit-* headers and Retry-After when ARM throttles cluster-management
      calls; back off exponentially.
  - name: Kubernetes priority and fairness
    description: API server uses APF (API Priority and Fairness) to throttle kubectl/controllers
      under load; tune flow schemas for noisy controllers.
  - name: Use AKS Cluster Autoscaler / Karpenter
    description: Avoid hand-rolled scale-out controllers that hammer the API server; use the platform
      autoscalers.
  - name: Watch over poll
    description: Prefer informers and watches over polling list endpoints to reduce API-server load.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
