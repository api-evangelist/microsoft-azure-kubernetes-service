        orchestratorVersion:
          type: string
          description: The version of Kubernetes running on the Agent Pool.
        currentOrchestratorVersion:
          type: string
          readOnly: true
          description: The running Kubernetes version on the Agent Pool.
        nodeImageVersion:
          type: string
          readOnly: true
          description: The version of node image.
        enableAutoScaling:
          type: boolean
          description: Whether to enable auto-scaler.
        minCount:
          type: integer
          format: int32
          description: The minimum number of nodes for auto-scaling.
        maxCount:
          type: integer
          format: int32
          description: The maximum number of nodes for auto-scaling.
        scaleSetPriority:
          type: string
          enum:
            - Spot
            - Regular
          default: Regular
          description: The Virtual Machine Scale Set priority.
        scaleSetEvictionPolicy:
          type: string
          enum:
            - Delete
            - Deallocate
          default: Delete
          description: The Virtual Machine Scale Set eviction policy.
        spotMaxPrice:
          type: number
          format: float
          description: The maximum price for spot instances.
        scaleDownMode:
          type: string
          enum:
