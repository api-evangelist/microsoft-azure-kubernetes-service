  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ContainerService/managedClusters/{resourceName}/stop
  : post:
      operationId: ManagedClusters_Stop
      summary: Azure Kubernetes Service Stop a managed cluster
      description: >-
        Stops a previously running managed cluster. This can only be performed
        on Azure Virtual Machine Scale Set backed clusters. Stopping a cluster
        stops the control plane and agent nodes entirely while maintaining all
        object and cluster state.
      tags:
        - Managed Clusters
      parameters:
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/ResourceNameParameter'
        - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: Accepted. The operation will complete asynchronously.
          headers:
