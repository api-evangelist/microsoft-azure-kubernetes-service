          default: 10.0.0.0/16
        dnsServiceIP:
          type: string
          description: >-
            An IP address assigned to the Kubernetes DNS service. It must be
            within the Kubernetes service address range.
          default: 10.0.0.10
        outboundType:
          type: string
          description: The outbound (egress) routing method.
          enum:
            - loadBalancer
            - userDefinedRouting
            - managedNATGateway
            - userAssignedNATGateway
            - none
          default: loadBalancer
        loadBalancerSku:
          type: string
          description: The load balancer sku for the managed cluster.
          enum:
            - standard
            - basic
          default: standard
        loadBalancerProfile:
          $ref: '#/components/schemas/ManagedClusterLoadBalancerProfile'
        natGatewayProfile:
          $ref: '#/components/schemas/ManagedClusterNATGatewayProfile'
        ipFamilies:
          type: array
          items:
            type: string
            enum:
              - IPv4
              - IPv6
          description: >-
            IP families used to specify IP versions available to the cluster.
    ManagedClusterLoadBalancerProfile:
      type: object
      description: Profile of the managed cluster load balancer.
      properties:
        managedOutboundIPs:
          type: object
          properties:
            count:
              type: integer
              format: int32
              minimum: 1
              maximum: 100
              default: 1
              description: >-
                The desired number of outbound IPs created/managed by Azure
                for the cluster load balancer.
          description: Desired managed outbound IPs for the cluster load balancer.
        outboundIPPrefixes:
          type: object
          properties:
            publicIPPrefixes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The fully qualified Azure resource id.
          description: >-
            Desired outbound IP Prefix resources for the cluster load balancer.
        outboundIPs:
          type: object
          properties:
            publicIPs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The fully qualified Azure resource id.
          description: Desired outbound IP resources for the cluster load balancer.
        effectiveOutboundIPs:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: string
                description: The fully qualified Azure resource id.
          description: The effective outbound IP resources of the cluster load balancer.
        allocatedOutboundPorts:
          type: integer
          format: int32
          minimum: 0
          maximum: 64000
          default: 0
          description: The desired number of allocated SNAT ports per VM.
        idleTimeoutInMinutes:
          type: integer
          format: int32
          minimum: 4
          maximum: 120
          default: 30
          description: >-
            Desired outbound flow idle timeout in minutes.
    ManagedClusterNATGatewayProfile:
      type: object
      description: Profile of the managed cluster NAT gateway.
      properties:
        managedOutboundIPProfile:
          type: object
          properties:
            count:
              type: integer
              format: int32
              minimum: 1
              maximum: 16
              default: 1
              description: The desired number of outbound IPs for the NAT gateway.
          description: The managed outbound IP profile of the NAT gateway.
        effectiveOutboundIPs:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: string
                description: The fully qualified Azure resource id.
          description: The effective outbound IP resources of the NAT gateway.
        idleTimeoutInMinutes:
          type: integer
          format: int32
          minimum: 4
          maximum: 120
          default: 4
          description: >-
            Desired outbound flow idle timeout in minutes.
    ManagedClusterAADProfile:
      type: object
      description: >-
        Azure Active Directory configuration for integration with AKS.
      properties:
        managed:
          type: boolean
          description: Whether to enable managed AAD.
        enableAzureRBAC:
          type: boolean
          description: Whether to enable Azure RBAC for Kubernetes authorization.
        adminGroupObjectIDs:
          type: array
          items:
            type: string
          description: >-
            The list of AAD group object IDs that will have admin role of the
            cluster.
        clientAppID:
          type: string
          description: >-
            (DEPRECATED) The client AAD application ID. Used for legacy/non-managed AAD.
        serverAppID:
          type: string
          description: >-
            (DEPRECATED) The server AAD application ID. Used for legacy/non-managed AAD.
        serverAppSecret:
          type: string
          description: >-
            (DEPRECATED) The server AAD application secret. Used for legacy/non-managed AAD.
        tenantID:
          type: string
          description: >-
            The AAD tenant ID to use for authentication. If not specified, will
            use the tenant of the deployment subscription.
    ManagedClusterAutoScalerProfile:
      type: object
      description: Parameters to be applied to the cluster-autoscaler.
      properties:
        balance-similar-node-groups:
          type: string
          description: >-
            Detects similar node pools and balances the number of nodes between
            them.
        daemonset-eviction-for-empty-nodes:
          type: boolean
          description: >-
            If set to true, all daemonset pods on empty nodes will be evicted
            before deletion of the node.
        daemonset-eviction-for-occupied-nodes:
          type: boolean
          description: >-
            If set to true, all daemonset pods on occupied nodes will be
            evicted before deletion of the node.
        expander:
          type: string
          description: The expander to use when scaling up.
          enum:
            - least-waste
            - most-pods
            - priority
            - random
          default: random
        max-empty-bulk-delete:
          type: string
          description: The maximum number of empty nodes that can be deleted at the same time.
          default: '10'
        max-graceful-termination-sec:
          type: string
          description: >-
            Maximum number of seconds the cluster autoscaler waits for pod
            termination when trying to scale down a node.
          default: '600'
        max-node-provision-time:
          type: string
          description: >-
            The maximum time the autoscaler waits for a node to be provisioned.
          default: 15m
        max-total-unready-percentage:
          type: string
          description: >-
            Maximum percentage of unready nodes in the cluster. After this
            percentage is exceeded, the cluster autoscaler halts operations.
          default: '45'
        new-pod-scale-up-delay:
          type: string
          description: >-
            For scenarios like burst/batch scale where you do not want CA to
            act before the kubernetes scheduler could schedule all the pods.
          default: 0s
        ok-total-unready-count:
          type: string
          description: >-
            Number of allowed unready nodes, irrespective of
            max-total-unready-percentage.
          default: '3'
        scan-interval:
          type: string
          description: How often the cluster is reevaluated for scale up or down.
          default: 10s
        scale-down-delay-after-add:
          type: string
          description: >-
            How long after scale up that scale down evaluation resumes.
          default: 10m
        scale-down-delay-after-delete:
          type: string
          description: >-
            How long after node deletion that scale down evaluation resumes.
          default: scan-interval
        scale-down-delay-after-failure:
          type: string
          description: >-
            How long after scale down failure that scale down evaluation
            resumes.
          default: 3m
        scale-down-unneeded-time:
          type: string
          description: >-
            How long a node should be unneeded before it is eligible for scale
            down.
          default: 10m
        scale-down-unready-time:
          type: string
          description: >-
            How long an unready node should be unneeded before it is eligible
            for scale down.
          default: 20m
        scale-down-utilization-threshold:
          type: string
          description: >-
            Node utilization level, defined as sum of requested resources
            divided by capacity, below which a node can be considered for
            scale down.
          default: '0.5'
        skip-nodes-with-local-storage:
          type: string
          description: >-
            Whether the cluster autoscaler will skip deleting nodes with pods
            with local storage.
          default: 'true'
        skip-nodes-with-system-pods:
          type: string
          description: >-
            Whether the cluster autoscaler will skip deleting nodes with pods
            from kube-system (except for DaemonSet or mirror pods).
          default: 'true'
    ManagedClusterAutoUpgradeProfile:
      type: object
      description: Auto upgrade profile for a managed cluster.
      properties:
        upgradeChannel:
          type: string
          description: The upgrade channel for auto upgrade.
          enum:
            - rapid
            - stable
            - patch
            - node-image
            - none
        nodeOSUpgradeChannel:
          type: string
          description: >-
            The node OS upgrade channel. Manner in which the OS on your nodes
            is updated.
          enum:
            - None
            - Unmanaged
            - SecurityPatch
            - NodeImage
    ClusterUpgradeSettings:
      type: object
      description: Settings for upgrading a cluster.
      properties:
        overrideSettings:
          type: object
          description: Settings for overrides during upgrade.
          properties:
            forceUpgrade:
              type: boolean
              description: >-
                Whether to force upgrade the cluster. Note that this option
                instructs the upgrade operation to bypass upgrade protections.
            until:
              type: string
              format: date-time
              description: Until when the overrides are effective.
    ManagedClusterAPIServerAccessProfile:
      type: object
      description: Access profile for managed cluster API server.
      properties:
        authorizedIPRanges:
          type: array
          items:
            type: string
          description: IP ranges authorized to access the Kubernetes API server.
        enablePrivateCluster:
          type: boolean
          description: Whether to create the cluster as a private cluster or not.
        privateDNSZone:
          type: string
          description: The private DNS zone mode for the cluster.
        enablePrivateClusterPublicFQDN:
          type: boolean
          description: Whether to create a public FQDN for private cluster or not.
        disableRunCommand:
          type: boolean
          description: Whether to disable run command for the cluster.
        enableVnetIntegration:
          type: boolean
          description: Whether to enable API server VNET integration for the cluster.
        subnetId:
          type: string
          description: >-
            The subnet to be used when API server VNET integration is enabled.
    ManagedClusterSecurityProfile:
      type: object
      description: Security profile for the container service cluster.
      properties:
        defender:
          type: object
          description: Microsoft Defender settings for the security profile.
          properties:
            logAnalyticsWorkspaceResourceId:
              type: string
              description: Resource ID of the Log Analytics workspace.
            securityMonitoring:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether to enable Defender threat detection.
        workloadIdentity:
          type: object
          description: Workload identity settings for the security profile.
          properties:
            enabled:
              type: boolean
              description: Whether to enable workload identity.
        imageCleaner:
          type: object
          description: Image Cleaner settings for the security profile.
          properties:
            enabled:
              type: boolean
              description: Whether to enable Image Cleaner.
            intervalHours:
              type: integer
              format: int32
              description: Image Cleaner scanning interval in hours.
    ManagedClusterStorageProfile:
      type: object
      description: Storage profile for the container service cluster.
      properties:
        diskCSIDriver:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to enable AzureDisk CSI Driver.
        fileCSIDriver:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to enable AzureFile CSI Driver.
        snapshotController:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to enable Snapshot Controller.
        blobCSIDriver:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether to enable AzureBlob CSI Driver.
    ManagedClusterIngressProfile:
      type: object
      description: Ingress profile for the managed cluster.
      properties:
        webAppRouting:
          type: object
          description: Web App Routing settings.
          properties:
            enabled:
              type: boolean
              description: Whether to enable Web App Routing.
            dnsZoneResourceIds:
              type: array
              items:
                type: string
              description: Resource IDs of the DNS zones.
    ManagedClusterOIDCIssuerProfile:
      type: object
      description: The OIDC issuer profile of the Managed Cluster.
      properties:
        issuerURL:
          type: string
          readOnly: true
          description: The OIDC issuer url of the Managed Cluster.
        enabled:
          type: boolean
          description: Whether the OIDC issuer is enabled.
    ManagedClusterMetricsProfile:
      type: object
      description: The metrics profile for the ManagedCluster.
      properties:
        costAnalysis:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the cost analysis add-on is enabled.
    ManagedClusterAzureMonitorProfile:
      type: object
      description: Azure Monitor addon profiles for monitoring the managed cluster.
      properties:
        metrics:
          type: object
          description: Metrics profile for the Azure Monitor managed service for Prometheus addon.
          properties:
            enabled:
              type: boolean
              description: Whether to enable the Prometheus collector.
    ServiceMeshProfile:
      type: object
      description: >-
        Service mesh profile for a managed cluster.
      properties:
        mode:
          type: string
          description: Mode of the service mesh.
          enum:
            - Istio
            - Disabled
        istio:
          type: object
          description: Istio service mesh configuration.
          properties:
            revisions:
              type: array
              items:
                type: string
              description: The list of revisions of the Istio control plane.
    ManagedClusterWorkloadAutoScalerProfile:
      type: object
      description: Workload Auto-scaler profile for the managed cluster.
      properties:
        keda:
          type: object
          description: KEDA (Kubernetes Event-driven Autoscaling) settings.
          properties:
            enabled:
              type: boolean
              description: Whether to enable KEDA.
        verticalPodAutoscaler:
          type: object
          description: VPA (Vertical Pod Autoscaler) settings.
          properties:
            enabled:
              type: boolean
              description: Whether to enable VPA.
            controlledValues:
              type: string
              description: >-
                Controls which resource value autoscaler acts on.
              enum:
                - RequestsAndLimits
                - RequestsOnly
    ManagedClusterNodeResourceGroupProfile:
      type: object
      description: Node resource group lockdown profile for a managed cluster.
      properties:
        restrictionLevel:
          type: string
          description: The restriction level applied to the cluster node resource group.
          enum:
            - Unrestricted
            - ReadOnly
    AgentPoolUpgradeSettings:
      type: object
      description: Settings for upgrading an agentpool.
      properties:
        maxSurge:
          type: string
          description: >-
            The maximum number or percentage of nodes that are surged during
            upgrade. This can either be set to an integer (e.g. 5) or a
            percentage (e.g. 50%). If a percentage is specified, it is the
            percentage of the total agent pool size at the time of the upgrade.
        drainTimeoutInMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
          description: >-
            The amount of time (in minutes) to wait on eviction of pods and
            graceful termination per node.
        nodeSoakDurationInMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          description: >-
            The amount of time (in minutes) to wait after draining a node and
            before reimaging it and moving on to the next node.
    PowerState:
      type: object
      description: Describes the Power State of the cluster.
      properties:
        code:
          type: string
          description: Tells whether the cluster is Running or Stopped.
          enum:
            - Running
            - Stopped
    CreationData:
      type: object
      description: >-
        Data used when creating a target resource from a source resource.
      properties:
        sourceResourceId:
          type: string
          description: >-
            This is the ARM ID of the source object to be used to create the
            target object.
    ManagedClusterListResult:
      type: object
      description: The response from the List Managed Clusters operation.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/ManagedCluster'
          description: The list of managed clusters.
        nextLink:
          type: string
          readOnly: true
          description: The URL to get the next set of managed cluster results.
    AgentPoolListResult:
      type: object
      description: The response from the List Agent Pools operation.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/AgentPool'
          description: The list of agent pools.
        nextLink:
          type: string
          readOnly: true
          description: The URL to get the next set of agent pool results.
    ManagedClusterUpgradeProfile:
      type: object
      description: The list of available upgrades for compute pools.
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the upgrade profile.
        name:
          type: string
          readOnly: true
          description: The name of the upgrade profile.
        type:
          type: string
          readOnly: true
          description: The type of the upgrade profile.
        properties:
          type: object
          required:
            - controlPlaneProfile
            - agentPoolProfiles
          properties:
            controlPlaneProfile:
              type: object
              description: The list of available upgrade versions for the control plane.
              properties:
                kubernetesVersion:
                  type: string
                  description: The Kubernetes version.
                osType:
                  type: string
                  enum:
                    - Linux
                    - Windows
                  default: Linux
                upgrades:
                  type: array
                  items:
                    type: object
                    properties:
                      kubernetesVersion:
                        type: string
                      isPreview:
                        type: boolean
            agentPoolProfiles:
              type: array
              items:
                type: object
                properties:
                  kubernetesVersion:
                    type: string
                  osType:
                    type: string
                    enum:
                      - Linux
                      - Windows
                    default: Linux
                  upgrades:
                    type: array
                    items:
                      type: object
                      properties:
                        kubernetesVersion:
                          type: string
                        isPreview:
                          type: boolean
              description: The list of available upgrade versions for agent pools.
    AgentPoolUpgradeProfile:
      type: object
      description: The list of available upgrades for an agent pool.
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the agent pool upgrade profile.
        name:
          type: string
          readOnly: true
          description: The name of the agent pool upgrade profile.
        type:
          type: string
          readOnly: true
          description: The type of the agent pool upgrade profile.
        properties:
          type: object
          required:
            - kubernetesVersion
            - osType
          properties:
            kubernetesVersion:
              type: string
              description: The Kubernetes version.
            osType:
              type: string
              enum:
                - Linux
                - Windows
              default: Linux
            upgrades:
              type: array
              items:
                type: object
                properties:
                  kubernetesVersion:
                    type: string
                  isPreview:
                    type: boolean
            latestNodeImageVersion:
              type: string
              description: The latest node image version available for the agent pool.
    AgentPoolAvailableVersions:
      type: object
      description: The available agent pool versions.
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the agent pool version list.
        name:
          type: string
          readOnly: true
          description: The name of the agent pool version list.
        type:
          type: string
          readOnly: true
          description: The resource type.
        properties:
          type: object
          properties:
            agentPoolVersions:
              type: array
              items:
                type: object
                properties:
                  default:
                    type: boolean
                    description: Whether this version is the default.
                  kubernetesVersion:
                    type: string
                    description: The Kubernetes version.
                  isPreview:
                    type: boolean
                    description: Whether this version is in preview.
    CredentialResults:
      type: object
      description: The list of credential result response.
      properties:
        kubeconfigs:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              name:
                type: string
                readOnly: true
                description: The name of the credential.
              value:
                type: string
                format: byte
                readOnly: true
                description: >-
                  Base64-encoded Kubernetes configuration file.
          description: Base64-encoded Kubernetes configuration file.
    RunCommandRequest:
      type: object
      description: A run command request.
      required:
        - command
      properties:
        command:
          type: string
          description: The command to run.
        context:
          type: string
          description: >-
            A base64 encoded zip file containing the files required by the
            command.
        clusterToken:
          type: string
          description: AuthToken issued for AKS AAD Server App.
    RunCommandResult:
      type: object
      description: Run command result.
      properties:
        id:
          type: string
          readOnly: true
          description: The command id.
        properties:
          type: object
          readOnly: true
          properties:
            provisioningState:
              type: string
              readOnly: true
              description: Provisioning state.
            exitCode:
              type: integer
              format: int32
              readOnly: true
              description: The exit code of the command.
            startedAt:
              type: string
              format: date-time
              readOnly: true
              description: The time when the command started.
            finishedAt:
              type: string
              format: date-time
              readOnly: true
              description: The time when the command finished.
            logs:
              type: string
              readOnly: true
              description: The command output.
            reason:
              type: string
              readOnly: true
              description: An explanation of why provisioningState is set to failed.
    AgentPoolDeleteMachinesParameter:
      type: object
      description: The parameters for deleting machines in an agent pool.
      required:
        - machineNames
      properties:
        machineNames:
          type: array
          items:
            type: string
          description: The list of machine names to delete.
    TagsObject:
      type: object
      description: Tags object for patch operations.
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
    CloudError:
      type: object
      description: An error response from the Container service.
      properties:
        error:
          type: object
          description: Details about the error.
          properties:
            code:
              type: string
              description: >-
                An identifier for the error. Codes are invariant and are
                intended to be consumed programmatically.
            message:
              type: string
              description: >-
                A message describing the error, intended to be suitable for
                display in a user interface.
            target:
              type: string
              description: >-
                The target of the particular error. For example, the name of
                the property in error.
            details:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
              description: A list of additional details about the error.
externalDocs:
  description: Azure Kubernetes Service REST API Reference
  url: https://learn.microsoft.com/en-us/rest/api/aks/
