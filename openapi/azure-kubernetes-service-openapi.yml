components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: Impersonate your user account
  parameters:
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription. Must be a valid UUID.
      schema:
        type: string
        format: uuid
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: >-
        The name of the resource group. The name is case insensitive.
      schema:
        type: string
        minLength: 1
        maxLength: 90
    ResourceNameParameter:
      name: resourceName
      in: path
      required: true
      description: The name of the managed cluster resource.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-zA-Z0-9]$|^[a-zA-Z0-9][-_a-zA-Z0-9]{0,61}[a-zA-Z0-9]$'
    AgentPoolNameParameter:
      name: agentPoolName
      in: path
      required: true
      description: The name of the agent pool.
      schema:
        type: string
        minLength: 1
        maxLength: 12
        pattern: '^[a-z][a-z0-9]{0,11}$'
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation.
      schema:
        type: string
        default: '2025-10-01'
  schemas:
    ManagedCluster:
      type: object
      description: Managed cluster resource representing an Azure Kubernetes Service cluster.
      required:
        - location
      properties:
        id:
          type: string
          readOnly: true
          description: >-
            Fully qualified resource ID for the resource.
            Example: /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ContainerService/managedClusters/{resourceName}
        name:
          type: string
          readOnly: true
          description: The name of the resource.
        type:
          type: string
          readOnly: true
          description: >-
            The type of the resource.
            Example: Microsoft.ContainerService/managedClusters
        location:
          type: string
          description: The geo-location where the resource lives.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
        sku:
          $ref: '#/components/schemas/ManagedClusterSKU'
        kind:
          type: string
          description: >-
            This is primarily used to expose different UI experiences in the
            portal for different kinds.
        identity:
          $ref: '#/components/schemas/ManagedClusterIdentity'
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
        systemData:
          $ref: '#/components/schemas/SystemData'
          readOnly: true
        properties:
          $ref: '#/components/schemas/ManagedClusterProperties'
    ManagedClusterProperties:
      type: object
      description: Properties of the managed cluster.
      properties:
        provisioningState:
          type: string
          readOnly: true
          description: >-
            The current provisioning state of the managed cluster resource.
        powerState:
          $ref: '#/components/schemas/PowerState'
          readOnly: true
        maxAgentPools:
          type: integer
          format: int32
          readOnly: true
          description: The max number of agent pools for the managed cluster.
        kubernetesVersion:
          type: string
          description: >-
            The version of Kubernetes specified by the user. Both patch version
            (e.g. 1.20.13) and minor version (e.g. 1.20) are supported. When
            a minor version is specified, the latest supported patch version is
            chosen automatically.
        currentKubernetesVersion:
          type: string
          readOnly: true
          description: >-
            The version of Kubernetes the Managed Cluster is running.
        dnsPrefix:
          type: string
          description: >-
            This cannot be updated once the Managed Cluster has been created.
        fqdnSubdomain:
          type: string
          description: >-
            This cannot be updated once the Managed Cluster has been created.
            Used only with private clusters with custom private DNS zone.
        fqdn:
          type: string
          readOnly: true
          description: The FQDN of the master pool.
        privateFQDN:
          type: string
          readOnly: true
          description: The FQDN of private cluster.
        azurePortalFQDN:
          type: string
          readOnly: true
          description: >-
            The special FQDN used by the Azure Portal to access the Managed
            Cluster. It is only set for private cluster enabled clusters.
        enableRBAC:
          type: boolean
          description: Whether to enable Kubernetes Role-Based Access Control.
        supportPlan:
          type: string
          description: The support plan for the Managed Cluster.
          enum:
            - KubernetesOfficial
            - AKSLongTermSupport
          default: KubernetesOfficial
        disableLocalAccounts:
          type: boolean
          description: >-
            If set to true, getting static credentials will be disabled for
            this cluster.
        nodeResourceGroup:
          type: string
          description: >-
            The name of the resource group containing agent pool nodes.
        nodeResourceGroupProfile:
          $ref: '#/components/schemas/ManagedClusterNodeResourceGroupProfile'
        agentPoolProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ManagedClusterAgentPoolProfile'
          description: The agent pool properties.
        linuxProfile:
          $ref: '#/components/schemas/ContainerServiceLinuxProfile'
        windowsProfile:
          $ref: '#/components/schemas/ManagedClusterWindowsProfile'
        servicePrincipalProfile:
          $ref: '#/components/schemas/ManagedClusterServicePrincipalProfile'
        identityProfile:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserAssignedIdentity'
          description: Identities associated with the cluster.
        addonProfiles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ManagedClusterAddonProfile'
          description: The profile of managed cluster add-ons.
        networkProfile:
          $ref: '#/components/schemas/ContainerServiceNetworkProfile'
        aadProfile:
          $ref: '#/components/schemas/ManagedClusterAADProfile'
        autoScalerProfile:
          $ref: '#/components/schemas/ManagedClusterAutoScalerProfile'
        autoUpgradeProfile:
          $ref: '#/components/schemas/ManagedClusterAutoUpgradeProfile'
        upgradeSettings:
          $ref: '#/components/schemas/ClusterUpgradeSettings'
        apiServerAccessProfile:
          $ref: '#/components/schemas/ManagedClusterAPIServerAccessProfile'
        diskEncryptionSetID:
          type: string
          description: >-
            The Resource ID of the disk encryption set to use for enabling
            encryption at rest.
        securityProfile:
          $ref: '#/components/schemas/ManagedClusterSecurityProfile'
        storageProfile:
          $ref: '#/components/schemas/ManagedClusterStorageProfile'
        ingressProfile:
          $ref: '#/components/schemas/ManagedClusterIngressProfile'
        oidcIssuerProfile:
          $ref: '#/components/schemas/ManagedClusterOIDCIssuerProfile'
        metricsProfile:
          $ref: '#/components/schemas/ManagedClusterMetricsProfile'
        azureMonitorProfile:
          $ref: '#/components/schemas/ManagedClusterAzureMonitorProfile'
        serviceMeshProfile:
          $ref: '#/components/schemas/ServiceMeshProfile'
        workloadAutoScalerProfile:
          $ref: '#/components/schemas/ManagedClusterWorkloadAutoScalerProfile'
    ManagedClusterAgentPoolProfile:
      type: object
      description: Profile for the container service agent pool.
      required:
        - name
      properties:
        name:
          type: string
          description: >-
            The unique name of the agent pool profile in the context of the
            subscription and resource group.
          minLength: 1
          maxLength: 12
          pattern: '^[a-z][a-z0-9]{0,11}$'
        count:
          type: integer
          format: int32
          description: >-
            Number of agents (VMs) to host docker containers. Allowed values
            must be in the range of 0 to 1000 (inclusive) for user pools and
            in the range of 1 to 1000 (inclusive) for system pools.
        vmSize:
          type: string
          description: >-
            The size of the agent VMs.
            Example: Standard_DS2_v2
        osDiskSizeGB:
          type: integer
          format: int32
          minimum: 0
          maximum: 2048
          description: >-
            OS Disk Size in GB to be used to specify the disk size for every
            machine in the master/agent pool.
        osDiskType:
          type: string
          description: The OS disk type to be used for machines in the agent pool.
          enum:
            - Managed
            - Ephemeral
        kubeletDiskType:
          type: string
          description: >-
            Determines the placement of emptyDir volumes, container runtime
            data root, and Kubelet ephemeral storage.
          enum:
            - OS
            - Temporary
        maxPods:
          type: integer
          format: int32
          description: The maximum number of pods that can run on a node.
        osType:
          type: string
          description: The operating system type.
          enum:
            - Linux
            - Windows
          default: Linux
        osSKU:
          type: string
          description: >-
            Specifies the OS SKU used by the agent pool.
          enum:
            - Ubuntu
            - AzureLinux
            - CBLMariner
            - Windows2019
            - Windows2022
            - WindowsAnnual
        type:
          type: string
          description: The type of Agent Pool.
          enum:
            - VirtualMachineScaleSets
            - AvailabilitySet
            - VirtualMachines
        mode:
          type: string
          description: >-
            The mode of an agent pool. A cluster must have at least one
            System agent pool at all times.
          enum:
            - System
            - User
            - Gateway
        orchestratorVersion:
          type: string
          description: >-
            The version of Kubernetes running on the Agent Pool.
        currentOrchestratorVersion:
          type: string
          readOnly: true
          description: >-
            The version of Kubernetes the Agent Pool is running.
        nodeImageVersion:
          type: string
          readOnly: true
          description: The version of node image.
        enableAutoScaling:
          type: boolean
          description: Whether to enable auto-scaler.
        minCount:
          type: integer
          format: int32
          description: The minimum number of nodes for auto-scaling.
        maxCount:
          type: integer
          format: int32
          description: The maximum number of nodes for auto-scaling.
        scaleSetPriority:
          type: string
          description: The Virtual Machine Scale Set priority.
          enum:
            - Spot
            - Regular
          default: Regular
        scaleSetEvictionPolicy:
          type: string
          description: The Virtual Machine Scale Set eviction policy.
          enum:
            - Delete
            - Deallocate
          default: Delete
        spotMaxPrice:
          type: number
          format: float
          description: >-
            The maximum price (in US Dollars) you are willing to pay for spot
            instances. Possible values are any decimal value greater than zero
            or -1 which indicates that default price is up-to on-demand.
        scaleDownMode:
          type: string
          description: >-
            Describes how VMs are added to or removed from Agent Pools.
          enum:
            - Delete
            - Deallocate
          default: Delete
        vnetSubnetID:
          type: string
          description: >-
            The ID of the subnet which agent pool nodes and optionally pods
            will join on startup.
        podSubnetID:
          type: string
          description: >-
            The ID of the subnet which pods will join when launched.
        enableNodePublicIP:
          type: boolean
          description: >-
            Whether each node is allocated its own public IP.
        nodePublicIPPrefixID:
          type: string
          description: >-
            The public IP prefix ID for the nodes in the agent pool.
        enableEncryptionAtHost:
          type: boolean
          description: >-
            Whether to enable host-based OS and data drive encryption.
        enableFIPS:
          type: boolean
          description: >-
            Whether to use a FIPS-enabled OS.
        enableUltraSSD:
          type: boolean
          description: Whether to enable UltraSSD.
        nodeLabels:
          type: object
          additionalProperties:
            type: string
          description: >-
            The node labels to be persisted across all nodes in agent pool.
        nodeTaints:
          type: array
          items:
            type: string
          description: >-
            The taints added to new nodes during node pool create and scale.
        tags:
          type: object
          additionalProperties:
            type: string
          description: >-
            The tags to be persisted on the agent pool virtual machine scale set.
        proximityPlacementGroupID:
          type: string
          description: The ID for Proximity Placement Group.
        upgradeSettings:
          $ref: '#/components/schemas/AgentPoolUpgradeSettings'
        powerState:
          $ref: '#/components/schemas/PowerState'
        availabilityZones:
          type: array
          items:
            type: string
          description: >-
            The list of Availability zones to use for nodes.
            This can only be specified if the AgentPoolType property is
            VirtualMachineScaleSets.
        creationData:
          $ref: '#/components/schemas/CreationData'
        workloadRuntime:
          type: string
          description: Determines the type of workload a node can run.
          enum:
            - OCIContainer
            - WasmWasi
            - KataMshvVmIsolation
        messageOfTheDay:
          type: string
          description: >-
            A base64-encoded string which will be written to /etc/motd after
            decoding. Applicable only for Linux nodes.
