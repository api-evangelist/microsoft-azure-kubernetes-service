      summary: Azure Kubernetes Service Abort the latest operation on a managed cluster
      description: >-
        Aborts the currently running operation on the managed cluster.
        The Managed Cluster will be moved to a Canceling state and eventually
        to a Canceled state when cancellation finishes.
      tags:
        - Managed Clusters
      parameters:
        - $ref: '#/components/parameters/SubscriptionIdParameter'
        - $ref: '#/components/parameters/ResourceGroupNameParameter'
        - $ref: '#/components/parameters/ResourceNameParameter'
        - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
