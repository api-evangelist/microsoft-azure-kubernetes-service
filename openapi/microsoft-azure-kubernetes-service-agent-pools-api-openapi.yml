components:
  schemas:
    AgentPoolAvailableVersions:
      type: object
      description: The available agent pool versions.
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the agent pool version list.
          example: abc123
        name:
          type: string
          readOnly: true
          description: The name of the agent pool version list.
          example: Example Title
        type:
          type: string
          readOnly: true
          description: The resource type.
          example: example_value
        properties:
          type: object
          properties:
            agentPoolVersions:
              type: array
              items:
                type: object
                properties:
                  default:
                    type: boolean
                    description: Whether this version is the default.
                  kubernetesVersion:
                    type: string
                    description: The Kubernetes version.
                  isPreview:
                    type: boolean
                    description: Whether this version is in preview.
          example: example_value
    AgentPoolDeleteMachinesParameter:
      type: object
      description: The parameters for deleting machines in an agent pool.
      required:
      - machineNames
      properties:
        machineNames:
          type: array
          items:
            type: string
          description: The list of machine names to delete.
          example: []
    CloudError:
      type: object
      description: An error response from the Container service.
      properties:
        error:
          type: object
          description: Details about the error.
          properties:
            code:
              type: string
              description: An identifier for the error. Codes are invariant and are intended to be consumed programmatically.
            message:
              type: string
              description: A message describing the error, intended to be suitable for display in a user interface.
            target:
              type: string
              description: The target of the particular error. For example, the name of the property in error.
            details:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
              description: A list of additional details about the error.
          example: example_value
    AgentPoolUpgradeSettings:
      type: object
      description: Settings for upgrading an agentpool.
      properties:
        maxSurge:
          type: string
          description: The maximum number or percentage of nodes that are surged during upgrade. This can either be set to an integer (e.g. 5) or a percentage (e.g. 50%). If a percentage is specified, it is the percentage of the total agent pool size at the time of the upgrade.
          example: example_value
        drainTimeoutInMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
          description: The amount of time (in minutes) to wait on eviction of pods and graceful termination per node.
          example: 10
        nodeSoakDurationInMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          description: The amount of time (in minutes) to wait after draining a node and before reimaging it and moving on to the next node.
          example: 10
    CreationData:
      type: object
      description: Data used when creating a target resource from a source resource.
      properties:
        sourceResourceId:
          type: string
          description: This is the ARM ID of the source object to be used to create the target object.
          example: '500123'
    AgentPool:
      type: object
      description: Agent pool resource within a managed cluster.
      properties:
        id:
          type: string
          readOnly: true
          description: Resource ID.
          example: abc123
        name:
          type: string
          readOnly: true
          description: The name of the resource that is unique within a resource group.
          example: Example Title
        type:
          type: string
          readOnly: true
          description: Resource type.
          example: example_value
        properties:
          $ref: '#/components/schemas/AgentPoolProperties'
    AgentPoolListResult:
      type: object
      description: The response from the List Agent Pools operation.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/AgentPool'
          description: The list of agent pools.
          example: []
        nextLink:
          type: string
          readOnly: true
          description: The URL to get the next set of agent pool results.
          example: example_value
    AgentPoolProperties:
      type: object
      description: Properties for the container service agent pool profile.
      properties:
        provisioningState:
          type: string
          readOnly: true
          description: The current deployment or provisioning state.
          example: example_value
        count:
          type: integer
          format: int32
          description: Number of agents (VMs) to host docker containers. Allowed values must be in the range of 0 to 1000 (inclusive) for user pools and in the range of 1 to 1000 (inclusive) for system pools. The default value is 1.
          example: 10
        vmSize:
          type: string
          description: The size of the agent VMs.
          example: example_value
        osDiskSizeGB:
          type: integer
          format: int32
          minimum: 0
          maximum: 2048
          description: OS Disk Size in GB.
          example: 10
        osDiskType:
          type: string
          enum:
          - Managed
          - Ephemeral
          description: The OS disk type.
          example: Managed
        kubeletDiskType:
          type: string
          enum:
          - OS
          - Temporary
          description: Kubelet disk type.
          example: OS
        maxPods:
          type: integer
          format: int32
          description: The maximum number of pods that can run on a node.
          example: 10
        osType:
          type: string
          enum:
          - Linux
          - Windows
          default: Linux
          description: The operating system type.
          example: Linux
        osSKU:
          type: string
          enum:
          - Ubuntu
          - AzureLinux
          - CBLMariner
          - Windows2019
          - Windows2022
          - WindowsAnnual
          description: Specifies the OS SKU used by the agent pool.
          example: Ubuntu
        type:
          type: string
          enum:
          - VirtualMachineScaleSets
          - AvailabilitySet
          - VirtualMachines
          description: The type of Agent Pool.
          example: VirtualMachineScaleSets
        mode:
          type: string
          enum:
          - System
          - User
          - Gateway
          description: A cluster must have at least one System agent pool at all times.
          example: System
        orchestratorVersion:
          type: string
          description: The version of Kubernetes running on the Agent Pool.
          example: example_value
        currentOrchestratorVersion:
          type: string
          readOnly: true
          description: The running Kubernetes version on the Agent Pool.
          example: example_value
        nodeImageVersion:
          type: string
          readOnly: true
          description: The version of node image.
          example: example_value
        enableAutoScaling:
          type: boolean
          description: Whether to enable auto-scaler.
          example: true
        minCount:
          type: integer
          format: int32
          description: The minimum number of nodes for auto-scaling.
          example: 10
        maxCount:
          type: integer
          format: int32
          description: The maximum number of nodes for auto-scaling.
          example: 10
        scaleSetPriority:
          type: string
          enum:
          - Spot
          - Regular
          default: Regular
          description: The Virtual Machine Scale Set priority.
          example: Spot
        scaleSetEvictionPolicy:
          type: string
          enum:
          - Delete
          - Deallocate
          default: Delete
          description: The Virtual Machine Scale Set eviction policy.
          example: Delete
        spotMaxPrice:
          type: number
          format: float
          description: The maximum price for spot instances.
          example: 42.5
        scaleDownMode:
          type: string
          enum:
          - Delete
          - Deallocate
          default: Delete
          description: Describes how VMs are added to or removed from Agent Pools.
          example: Delete
        vnetSubnetID:
          type: string
          description: The ID of the subnet for agent pool nodes.
          example: '500123'
        podSubnetID:
          type: string
          description: The ID of the subnet for pods.
          example: '500123'
        enableNodePublicIP:
          type: boolean
          description: Whether each node gets its own public IP.
          example: true
        nodePublicIPPrefixID:
          type: string
          description: The public IP prefix ID for the nodes.
          example: '500123'
        enableEncryptionAtHost:
          type: boolean
          description: Whether to enable host-based encryption.
          example: true
        enableFIPS:
          type: boolean
          description: Whether to use FIPS-enabled OS.
          example: true
        enableUltraSSD:
          type: boolean
          description: Whether to enable UltraSSD.
          example: true
        nodeLabels:
          type: object
          additionalProperties:
            type: string
          description: The node labels to be persisted across all nodes.
          example: example_value
        nodeTaints:
          type: array
          items:
            type: string
          description: The taints added to new nodes.
          example: []
        tags:
          type: object
          additionalProperties:
            type: string
          description: The tags to persist on the VMSS.
          example: example_value
        proximityPlacementGroupID:
          type: string
          description: The ID for Proximity Placement Group.
          example: '500123'
        upgradeSettings:
          $ref: '#/components/schemas/AgentPoolUpgradeSettings'
        powerState:
          $ref: '#/components/schemas/PowerState'
        availabilityZones:
          type: array
          items:
            type: string
          description: The list of Availability zones to use for nodes.
          example: []
        creationData:
          $ref: '#/components/schemas/CreationData'
        workloadRuntime:
          type: string
          enum:
          - OCIContainer
          - WasmWasi
          - KataMshvVmIsolation
          description: The type of workload a node can run.
          example: OCIContainer
        messageOfTheDay:
          type: string
          description: A base64-encoded message of the day for Linux nodes.
          example: example_value
    AgentPoolUpgradeProfile:
      type: object
      description: The list of available upgrades for an agent pool.
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the agent pool upgrade profile.
          example: abc123
        name:
          type: string
          readOnly: true
          description: The name of the agent pool upgrade profile.
          example: Example Title
        type:
          type: string
          readOnly: true
          description: The type of the agent pool upgrade profile.
          example: example_value
        properties:
          type: object
          required:
          - kubernetesVersion
          - osType
          properties:
            kubernetesVersion:
              type: string
              description: The Kubernetes version.
            osType:
              type: string
              enum:
              - Linux
              - Windows
              default: Linux
            upgrades:
              type: array
              items:
                type: object
                properties:
                  kubernetesVersion:
                    type: string
                  isPreview:
                    type: boolean
            latestNodeImageVersion:
              type: string
              description: The latest node image version available for the agent pool.
          example: example_value
    PowerState:
      type: object
      description: Describes the Power State of the cluster.
      properties:
        code:
          type: string
          description: Tells whether the cluster is Running or Stopped.
          enum:
          - Running
          - Stopped
          example: Running
  parameters:
    AgentPoolNameParameter:
      name: agentPoolName
      in: path
      required: true
      description: The name of the agent pool.
      schema:
        type: string
        minLength: 1
        maxLength: 12
        pattern: ^[a-z][a-z0-9]{0,11}$
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription. Must be a valid UUID.
      schema:
        type: string
        format: uuid
    ResourceNameParameter:
      name: resourceName
      in: path
      required: true
      description: The name of the managed cluster resource.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-zA-Z0-9]$|^[a-zA-Z0-9][-_a-zA-Z0-9]{0,61}[a-zA-Z0-9]$
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation.
      schema:
        type: string
        default: '2025-10-01'
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group. The name is case insensitive.
      schema:
        type: string
        minLength: 1
        maxLength: 90
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: Impersonate your user account
